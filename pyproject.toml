[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-importer"
version = "0.1.0"
description = "Reliable import/export module (Lab05)"
requires-python = ">=3.11"
authors = [{ name = "Anastasiia Brativnyk" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["mypy>=1.10"]

[project.scripts]
reliable-importer = "reliable_importer.main:main"

[tool.mypy]
python_version = "3.11"
strict = true